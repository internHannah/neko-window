<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Doraemon Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Original CSS homage — not official Doraemon art -->
    <div id="neko" class="dora face-s" aria-hidden="true" title="Doraemon">
      <div class="dora-shadow"></div>
      <div class="dora-body">
        <div class="dora-head">
          <div class="dora-ear dora-ear-l"></div>
          <div class="dora-ear dora-ear-r"></div>
          <div class="dora-face">
            <div class="dora-eye dora-eye-l"><span></span></div>
            <div class="dora-eye dora-eye-r"><span></span></div>
            <div class="dora-nose"></div>
            <div class="dora-whisker w1"></div>
            <div class="dora-whisker w2"></div>
            <div class="dora-whisker w3"></div>
            <div class="dora-whisker w4"></div>
            <div class="dora-whisker w5"></div>
            <div class="dora-whisker w6"></div>
            <div class="dora-mouth"></div>
          </div>
        </div>
        <div class="dora-torso">
          <div class="dora-collar">
            <div class="dora-bell"></div>
          </div>
          <div class="dora-belly">
            <div class="dora-pocket"></div>
          </div>
          <div class="dora-arm dora-arm-l"></div>
          <div class="dora-arm dora-arm-r"></div>
          <div class="dora-foot dora-foot-l"></div>
          <div class="dora-foot dora-foot-r"></div>
        </div>
        <div class="dora-zzz">z</div>
      </div>
    </div>
    <div id="bubble" class="hidden" aria-hidden="true">💧 drink water!</div>
    <script src="neko.js"></script>
  </body>
</html>
